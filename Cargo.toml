process-reward-model = []
mcts-reasoning       = []
self-taught-reasoner = []
# v0.24.0 — Theme 3: Serving Runtime
continuous-batching = ["kv-cache-compression"]
request-scheduling  = []
chunked-prefill     = ["kv-cache-compression"]
# v0.24.0 — Theme 4: Corpus Governance & Fairness
corpus-curation   = ["lsh"]
fairness-ranking  = []
knowledge-editing = []
# v0.24.0 theme umbrellas
inference-time-control = ["constrained-decoding", "context-aware-decoding", "activation-steering"]
test-time-search       = ["process-reward-model", "mcts-reasoning", "self-taught-reasoner"]
serving-runtime        = ["continuous-batching", "request-scheduling", "chunked-prefill"]
corpus-governance      = ["corpus-curation", "fairness-ranking", "knowledge-editing"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"

[profile.release-wasm]
inherits = "release"
panic = "abort"
strip = true
opt-level = "z"

[[bin]]
name = "oxirag-server"
path = "src/bin/oxirag-server.rs"
required-features = ["rest-server"]

# Examples and benches are native-only. `native` is named explicitly in every
# `required-features` so that a wasm32 build — where `native` is off by
# definition — skips them instead of failing: `cargo build --tests` builds every
# example target too, so one unbuildable example is enough to stop
# `wasm-pack test` from running a single test.
[[example]]
name = "candle_slm_example"
required-features = ["native", "speculator"]

[[example]]
name = "lora_training_example"
required-features = ["native", "distillation"]

[[example]]
name = "multimodal_search"
required-features = ["native", "multimodal"]

[[example]]
name = "otel_tracing"
required-features = ["native", "otel"]

[[example]]
name = "rest_server"
required-features = ["native", "rest-server"]

[[test]]
name = "trait_bounds_native"
required-features = ["prefix-cache"]

[[bench]]
name = "benchmarks"
harness = false
required-features = ["native"]
