[package]
name = "oxirag"
version = "0.24.0"
edition = "2024"
description = "A four-layer RAG engine with SMT-based logic verification and knowledge graph support"
license = "Apache-2.0"
categories = ["wasm", "asynchronous", "text-processing"]
keywords = ["rag", "semantic-search", "smt", "wasm", "verification"]
documentation = "https://docs.rs/oxirag"
homepage = "https://github.com/cool-japan/oxirag"
repository = "https://github.com/cool-japan/oxirag"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core
thiserror = "2.0"
async-trait = "0.1"
# Runtime-agnostic async `RwLock`/`Mutex`. `src/sync.rs` takes its primitives from
# here whenever `tokio` is not in the build — which is every `wasm32` build (no
# runtime, no threads) and every `--no-default-features` build on any target.
# Unconditional rather than optional so that "OxiRAG without tokio" is a
# configuration that compiles everywhere rather than one that compiles on wasm32
# and nowhere else. Pure Rust, three small crates. See ADR-0006.
async-lock = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.23", features = ["v4", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Async runtime (native)
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "fs"], optional = true }
tokio-stream = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }

# WASM support.
#
# These are declared under `[target.'cfg(target_arch = "wasm32")'.dependencies]`
# rather than here, and they are NOT optional there. The distinction matters:
#
#   * building OxiRAG *for* wasm32 needs them unconditionally — `src/sync.rs`
#     has no `tokio::sync` to fall back on and `src/retry.rs` has no timer, so a
#     wasm32 build without them is not a smaller build, it is a broken one;
#   * the `wasm` FEATURE means something narrower: expose `src/wasm.rs` and
#     `src/wasm_worker.rs`, the `#[wasm_bindgen]` surface JavaScript calls.
#
# A downstream shim that writes its own `#[wasm_bindgen]` boundary (the
# COOLJAPAN Playground `/rag` demo does) therefore takes OxiRAG *without* the
# `wasm` feature and still compiles for wasm32 — and does not inherit a second
# `#[wasm_bindgen(start)]` or an export surface it does not use.

# Layer 1: Echo (currently using pure Rust for similarity)
# numrs2 = { version = "0.1", optional = true }

# Layer 2: Speculator (native only - not WASM compatible)
# Base candle dependencies (CPU only)
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
hf-hub = { version = "0.5", optional = true }
tokenizers = { version = "0.23", optional = true }

# Multi-modal (image + text) support
image = { version = "0.25", optional = true }

# Layer 3: Judge
oxiz = { version = "0.3.2", optional = true }

# Persistent storage backend (pure Rust, ACID embedded DB)
redb = { version = "4", optional = true }

# OpenTelemetry integration (optional, otel feature)
opentelemetry = { version = "0.32", optional = true, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", optional = true, features = ["trace", "grpc-tonic"] }
opentelemetry-stdout = { version = "0.32", optional = true, features = ["trace"] }
tonic = { version = "0.14", optional = true }

# Python bindings (pyo3 feature)
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"], optional = true }

# Node.js bindings (napi-rs)
napi = { version = "3", features = ["napi4", "tokio_rt", "async"], optional = true }
napi-derive = { version = "3", optional = true }

# REST server dependencies
axum = { version = "0.8", optional = true, features = ["json", "macros"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", optional = true, features = ["cors", "trace"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    # IndexedDB
    "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbTransaction",
    "IdbRequest", "IdbOpenDbRequest", "IdbKeyRange", "IdbTransactionMode",
    "IdbCursor", "IdbCursorWithValue", "IdbVersionChangeEvent", "DomStringList",
    "Window", "WorkerGlobalScope",
    # Web Worker
    "Worker", "WorkerOptions", "DedicatedWorkerGlobalScope",
    "MessageEvent", "MessagePort",
    # Streaming
    "ReadableStream", "ReadableStreamDefaultController",
] }
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"

# Neither is called from OxiRAG. Both exist to turn on `getrandom`'s JavaScript
# backend for the two majors that reach the wasm32 graph: 0.4 directly, and 0.3
# transitively through `ahash <- dashmap <- lasso <- oxiz-core` (the `judge`
# feature). Cargo features are additive and only a DIRECT dependent can turn one
# on, which is the whole reason these lines exist — a transitive `getrandom`
# cannot enable its own backend.
#
# `getrandom 0.3` needs a second piece of wiring on top: the
# `--cfg getrandom_backend="wasm_js"` rustflag in `.cargo/config.toml`. Without
# it the crate refuses to compile for wasm32; without the features here it
# compiles and then fails at the point of use. Downstream consumers need that
# rustflag in their own config — cargo never reads it from a dependency.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# CUDA support - only available on x86_64 Linux and Windows (where CUDA toolkit exists)
# cudarc is the underlying CUDA runtime - target-gated to prevent build failures on unsupported platforms
[target.'cfg(all(target_arch = "x86_64", any(target_os = "linux", target_os = "windows")))'.dependencies]
cudarc = { version = "0.19", optional = true, features = ["cuda-12000"] }

[build-dependencies]
napi-build = "2"

# Dev dependencies that build on every target. Everything else is split by
# target below, because `cargo build --tests` resolves ALL dev-dependencies
# regardless of which test uses them: `proptest` pulls `rusty-fork` pulls
# `wait-timeout`, which does not compile for wasm32 at all. With them in this
# table `wasm-pack test` cannot run a single test, which is why the wasm test
# files that exist have only ever been skipped.
[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.8", features = ["async_tokio"] }
tempfile = "3.27"
proptest = "1.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[features]
default = ["native", "echo"]
# Native target with full async runtime
native = ["tokio", "tokio-stream", "futures"]
# WASM target for browser/edge deployment
# Exposes the `#[wasm_bindgen]` surface in `src/wasm.rs` / `src/wasm_worker.rs`.
# The crates it used to name are unconditional wasm32 target dependencies now —
# see the `[target.'cfg(target_arch = "wasm32")'.dependencies]` section — so this
# feature is about the JavaScript API, not about being buildable for wasm32.
wasm = []
# Layer features
echo = []
speculator = ["candle-core", "candle-nn", "candle-transformers", "hf-hub", "tokenizers"]
judge = ["oxiz"]
multimodal = ["speculator", "dep:image"]
graphrag = []
distillation = []
prefix-cache = []
# Hidden states for speculative decoding
hidden-states = []
# Quantization for vector embeddings
quantization = []
# Persistent redb backend for prefix cache
prefix-cache-redb = ["prefix-cache", "dep:redb"]
# Persistent redb backend for vector store (Layer 1 Echo)
echo-redb = ["echo", "dep:redb"]
# Persistent redb backend for graph store (Layer 4 GraphRAG)
graphrag-redb = ["graphrag", "dep:redb"]
# OpenTelemetry integration (native only - requires async runtime)
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-stdout", "dep:tonic", "native"]
# REST server feature (native only)
rest-server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tracing-subscriber", "native"]
# Python bindings (requires pyo3 0.28 + maturin)
python = ["dep:pyo3", "dep:pyo3-async-runtimes", "native", "echo"]
# Node.js bindings (napi-rs 2.x, build via @napi-rs/cli)
nodejs = ["dep:napi", "dep:napi-derive", "native", "echo"]
# WASM IndexedDB backend for VectorStore
wasm-indexeddb = ["wasm", "echo"]
# WASM IndexedDB backend for PrefixCache
wasm-prefix-indexeddb = ["wasm", "prefix-cache"]
# All layers (native only due to speculator)
full = ["native", "echo", "speculator", "judge", "graphrag", "prefix-cache", "distillation", "hidden-states", "quantization", "prefix-cache-redb", "echo-redb", "graphrag-redb"]
# Hardware acceleration features (marker features - platform-conditional)
# CUDA: Only works on x86_64 Linux/Windows where CUDA toolkit is installed
# The cudarc dependency is target-gated, so --all-features works on all platforms
# To actually use CUDA, the user must have CUDA toolkit installed and use candle-core with cuda feature
cuda = ["speculator", "dep:cudarc"]
# Metal: Available on macOS (Apple Silicon/AMD GPU)
# This is a marker feature - actual Metal support requires macOS and appropriate GPU
metal = ["speculator"]
# Document chunking strategies (always available — pure Rust, no ML deps)
chunking = []
# Semantic cache for query-level memoization (no extra deps)
semantic-cache = []
# Advanced retrieval: RAG-Fusion, HyDE, MMR (no extra deps)
advanced-retrieval = []
# RAG evaluation framework — RAGAS-style lexical metrics
rag-eval = []
# Multi-turn conversational RAG with history management and query reformulation
conversational = []
# FLARE: Forward-Looking Active REtrieval — iterative generate-retrieve loop
flare = []
# Knowledge base collections / namespaced multi-tenant indexing
collections = []
# Integrated document processing pipeline wiring chunking + cache + retrieval
document-pipeline = ["chunking", "semantic-cache", "advanced-retrieval"]
# Prompt template registry: {{var}} interpolation + {{#if}}/{{#unless}}/{{else}}
prompt-templates = []
# Query intent classification and adaptive retrieval-strategy routing
query-routing = []
# Corrective RAG (CRAG): retrieval-quality grading + corrective re-retrieval loop
corrective-rag = ["advanced-retrieval"]
# Inline citation and source attribution for generated answers
attribution = []
# Umbrella for the whole adaptive control plane
adaptive-control-plane = ["prompt-templates", "query-routing", "corrective-rag", "attribution"]
# Self-Reflective RAG with reflection tokens (decide when to retrieve, critique own output)
self-rag = []
# ReAct Thought→Action→Observation agentic loop with tool registry
agentic = []
# Sub-question decomposition → sub-answers → RRF recombination
query-decomposition = ["advanced-retrieval"]
# Extractive context distillation before generation
context-compression = []
# PII detection/redaction + prompt injection + content moderation + topical rails
guardrails = []
# JSON-schema-constrained typed entity extraction
structured-extraction = []
# Generated-answer rule enforcement (length, citations, banned phrases, etc.)
output-validation = []
# Louvain community detection over the GraphRAG entity-relationship graph
graph-community = ["graphrag"]
# Hierarchical community summaries + Microsoft-GraphRAG global/local search
graph-summarization = ["graph-community"]
# RAPTOR: recursive abstractive summary tree for multi-document retrieval
raptor = []
# Sentence-window / parent-document small-to-big retrieval
parent-document = ["chunking"]
# Recency-decay re-scoring with exponential/linear/Gaussian decay functions
temporal-retrieval = []
# Theme umbrellas (v0.10.0)
